spring.application.name=portafolio

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portafolio_elena}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
info.app.name=portafolio
info.app.version=0.0.1

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Debe tener al menos 32 bytes
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}
refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:14}

auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}

app.admin.bootstrap=${APP_ADMIN_BOOTSTRAP:false}
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

contact.notification-email=${CONTACT_NOTIFICATION_EMAIL:elenaalmansacampos@gmail.com}
contact.from-email=${MAIL_USERNAME:no-reply@localhost}

rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:10}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}